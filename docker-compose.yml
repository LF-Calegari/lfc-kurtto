services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kurtto}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh:ro
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kurtto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: development
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      SHORT_CODE_LENGTH: ${SHORT_CODE_LENGTH:-7}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-kurtto}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-kurtto}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-3600}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:5052}
    ports:
      - "${PORT:-3000}:3000"
      - "9229:9229"
    volumes:
      - .:/app
      - /app/node_modules

  test:
    profiles: ["test"]
    build:
      context: .
      target: development
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3000
      BASE_URL: http://localhost:3000
      SHORT_CODE_LENGTH: 7
      RATE_LIMIT_GLOBAL_MAX: 1000000
      RATE_LIMIT_POST_URLS_MAX: 1000000
      RATE_LIMIT_REDIRECT_MAX: 1000000
      KURTTO_TEST_DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/kurtto_test
      KURTTO_TEST_DATABASE_DROP_AFTER_RUN: "true"
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/kurtto_test
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: kurtto_test
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-3600}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:5052}
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "test"]

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      target: development
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-kurtto}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-kurtto}
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "migration:run"]

volumes:
  postgres_data:

networks:
  default:
    external: true
    name: ${EXTERNAL_NETWORK_NAME:-lfc_platform_network}
