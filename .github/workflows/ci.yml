name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kurtto
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kurtto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kurtto_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kurtto_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/kurtto_test
      KURTTO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kurtto_test
      BASE_URL: http://localhost:3000
      SHORT_CODE_LENGTH: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d kurtto -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'kurtto_test'" | grep -q 1 || \
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d kurtto -c \
            "CREATE DATABASE kurtto_test;"

      - name: Run migrations
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kurtto
        run: npm run migration:run

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
